version: "3.9"

services:
  envoy:
    image: envoyproxy/envoy:v1.30.1
    container_name: aegismas-envoy
    ports:
      - "8085:80"
    volumes:
      - ./gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aegismas-api
    networks:
      - aegis

  aegismas-api:
    build:
      context: ./aegismas-api
    container_name: aegismas-api
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TENANTS_FILE=/app/tenants.json
      - AEGIS_POSTURE_DEFAULT=fail-open
    volumes:
      - ./aegismas-api/tenants.json:/app/tenants.json:ro
    expose:
      - "8080"
    depends_on:
      - redis
    networks:
      - aegis

  redis:
    image: redis:7.2-alpine
    container_name: aegismas-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - aegis

networks:
  aegis: {}

volumes:
  redis-data: {}



