admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        protocol: TCP
        address: 0.0.0.0
        port_value: 8085
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              with_request_body:
                max_request_bytes: 2048
                allow_partial_message: true
              failure_mode_allow: false
              http_service:
                server_uri:
                  uri: http://defender_api:8080
                  cluster: defender_api
                  timeout: 2s
                path_prefix: /v1/decide
                authorization_request:
                  allowed_headers:
                    patterns:
                      - exact: ":method"
                      - exact: ":path"
                      - exact: ":authority"
                      - exact: "x-forwarded-for"
                      - exact: "user-agent"
                      - safe_regex:
                          google_re2: {}
                          regex: ".*"
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                      - exact: "x-aegis-origin"
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            virtual_hosts:
            - name: all_hosts
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: origin_backend
                  timeout: 30s

  clusters:
  - name: defender_api
    type: STRICT_DNS
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: defender_api
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: defender_api
                port_value: 8080

  - name: origin_backend
    type: STRICT_DNS
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: origin_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: host.docker.internal
                port_value: 8000

